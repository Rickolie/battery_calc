name: Scrape online data

on:
  schedule:
    - cron: "17 5 * * 1"     # weekly, Monday 05:17 UTC
    # Black Friday window (config.yaml blackfriday.window): every 4 hours
    - cron: "37 */4 20-30 11 *"
    - cron: "37 */4 1 12 *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m battery_calc.scrape
      - name: Commit updated data/online
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/online
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update online data ($(date -u +%F))"
            git push origin HEAD:main
          fi

  # Pushes made with GITHUB_TOKEN do not trigger other workflows, so deploy here.
  deploy:
    needs: scrape
    uses: ./.github/workflows/pages.yml
