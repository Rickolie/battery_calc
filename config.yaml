# battery_calc configuration. Every path, column name and tariff lives here.
# Values marked "verify: true" were entered by hand and should be checked
# against the source URL before relying on the results.

paths:
  data_dir: data
  p1_file: data/Energy_house.csv
  pv_file: data/pv_production.csv            # optional
  fixed_contract_file: data/vast.txt
  price_glob: data/jeroen_punt_nl_dynamische_stroomprijzen_jaar_*.csv
  # Scraped day-ahead prices (EnergyZero) fill recent months; jeroen.nl wins on overlap.
  extra_price_globs: [data/online/dayahead_energyzero_*.csv]
  taxes_file: data/online/taxes.csv        # scraped; overrides taxes.years when present
  energieknl_file: data/dynamic_prices_energieknl.csv   # optional cross-check
  online_dir: data/online
  contracts_file: data/online/contracts.csv
  batteries_file: data/online/batteries.csv
  results_dir: results

p1:
  time_column: time
  timezone: Europe/Amsterdam
  # The HomeWizard timestamp is the moment the counters were read, so the
  # delta at row t covers the 15 minutes *before* t.
  timestamp_marks: interval_end
  import_t1: Import T1 kWh       # T1 = dal / low tariff (NL convention)
  import_t2: Import T2 kWh       # T2 = normaal / normal tariff
  export_t1: Export T1 kWh
  export_t2: Export T2 kWh
  max_interpolate_gap_minutes: 60
  phase_max_columns: [L1 max W, L2 max W, L3 max W]   # optional per-phase peaks (power profile)

pv:
  time_column: time
  energy_column: kWh             # per-interval kWh; or set power_column (W)
  power_column: null

prices:
  timezone: Europe/Amsterdam
  # Column-name hints for the jeroen.nl files. The loader picks the first
  # column whose lower-case name contains one of these.
  kale_hints: [excl, kaal, kale, epex, spot, day-ahead, dayahead]
  incl_hints: [incl]
  mwh_threshold: 5.0             # median |price| above this => €/MWh
  crosscheck_threshold_eur_kwh: 0.001

connection:
  default: 3x25
  margin: 0.20                   # --connection-margin
  volts: 230
  options: [1x25, 1x35, 1x40, 3x25, 3x35, 3x40, 3x50, 3x63]

tariff_hours:                    # used for synthetic intervals (T1/T2 rule)
  normal_start_hour: 7
  normal_end_hour: 21
  weekend_is_low: true

# Taxes per calendar year, excl. VAT. Years after the latest one are held
# flat and grown with escalation_pct.
taxes:
  vat: 0.21
  escalation_pct: 0.0
  years:
    2024:
      # Used only for the solar-panel years 2024 (section 11).
      energy_tax_eur_kwh: 0.10880
      tax_reduction_eur_year: 521.81
      source_url: https://www.belastingdienst.nl/wps/wcm/connect/bldcontentnl/belastingdienst/zakelijk/overige_belastingen/belastingen_op_milieugrondslag/tarieven_milieubelastingen/tabellen_tarieven_milieubelastingen
      retrieved_at: '2026-10-06'
      verify: true
    2025:
      energy_tax_eur_kwh: 0.10154
      tax_reduction_eur_year: 524.95
      source_url: https://www.belastingdienst.nl/wps/wcm/connect/bldcontentnl/belastingdienst/zakelijk/overige_belastingen/belastingen_op_milieugrondslag/tarieven_milieubelastingen/tabellen_tarieven_milieubelastingen
      retrieved_at: '2026-10-02'
      verify: true
    2026:
      # Derived from vast.txt: (0.27125 - 0.16040) / 1.21
      energy_tax_eur_kwh: 0.09161
      tax_reduction_eur_year: 519.80
      source_url: https://www.belastingdienst.nl/wps/wcm/connect/bldcontentnl/belastingdienst/zakelijk/overige_belastingen/belastingen_op_milieugrondslag/tarieven_milieubelastingen/tabellen_tarieven_milieubelastingen
      retrieved_at: '2026-10-02'
      verify: true

# Grid operator charges, €/year excl. VAT, per connection size. Same for all
# suppliers, so they never change a ranking or a battery saving.
grid:
  operator: Enexis
  source: data/vast.txt (Netbeheerkosten Enexis Brabant)
  retrieved_at: '2026-10-02'
  eur_year_excl_vat:
    1x25: 393.25
    1x35: 393.25
    3x25: 393.25
    1x40: null                   # unknown: falls back to 3x25 with a warning
    3x35: null
    3x40: null
    3x50: null
    3x63: null

# Regimes (section 4). Each scenario names the rules applied to a year.
regimes:
  saldering:
    label: 2026 rules (saldering)
    saldering: true
    feed_in_min_frac: 0.0
    feed_in_incl_vat: true
  nosal_min50:
    label: 2027-2029 rules (no saldering, 50% minimum)
    saldering: false
    feed_in_min_frac: 0.5
    feed_in_incl_vat: false
  nosal_2030:
    label: 2030+ rules (no minimum)
    saldering: false
    feed_in_min_frac: 0.0        # sensitivity: 0.3
    feed_in_incl_vat: false
regime_by_year:                  # first year each regime applies
  saldering: 0
  nosal_min50: 2027
  nosal_2030: 2030
feed_in_min_2030_sensitivity: 0.30

scenario_flags:                  # possible future changes, off by default
  capacity_tariff: false
  capacity_tariff_eur_kw_month: 0.0

analysis:
  full_history_years: [2013, 2026]
  headline_years: [2023, 2025]
  year_groups:
    Pre-crisis: [2013, 2020]
    Crisis: [2021, 2022]
    Recent: [2023, 2026]
  purchase_date: '2026-10-02'
  discount_rate: 0.03
  horizon_years: 20
  payback_top_dynamic_contracts: 1   # battery runs on the cheapest N dynamic contracts (they differ only in markup)
  # Best-value battery per capacity class (nominal kWh). Classes meet halfway
  # between centres; the outer edges are centre ± halfwidth (2.5-6.25, 6.25-8.75,
  # 8.75-12.5, 12.5-17.5 kWh).
  size_classes_kwh: [5, 7.5, 10, 15]
  size_class_halfwidth_kwh: 2.5

battery_defaults:
  rte: 0.85
  standby_w: 10
  cycle_life: 6000
  eol_capacity: 0.70
  warranty_years: 10
  dod: 0.9                       # used when DoD and usable capacity are not stated
  min_soc_pct: 0.0
  residual_value: 0.0
  cycles_per_year: 250
  de_travel_cost_eur: 50.0
  # true = also consider German prices (0% VAT + travel): every calculation and
  # chart uses the cheaper of today's NL and DE price ("Cheapest NL/DE").
  use_german_prices: false

strategies:
  enabled: [self_consumption, timed, dynamic, dynamic_sell, forecast, hbc_default, hbc_pv_first, perfect_foresight,
            curtail]
  # Home Battery Control (github.com/gitcodebob/marstek-venus-rs485-node-red)
  # Dynamic strategy reproduced exactly ("Extreme-Pair Matching", flow
  # 02 strategy-dynamic-2.json). These run as-is in Home Assistant; the
  # `dynamic` strategy above needs custom control (peak reservation).
  # Sub-strategies: charge, charge_pv, self_consumption, sell, full_stop.
  hbc_presets:
    hbc_default:        # HBC defaults
      min_delta: 0.06
      cheapest_hrs: 0
      expensive_hrs: 0
      low: charge
      neutral: charge_pv
      high: self_consumption
    hbc_pv_first:       # HBC docs "PV-First Hybrid" without a solar forecast
      min_delta: 0.0
      cheapest_hrs: 0
      expensive_hrs: 0
      low: charge_pv
      neutral: charge_pv
      high: self_consumption
  dynamic:
    low_quantile: 0.25
    high_quantile: 0.75
    # charge_pv in Low periods holds stored energy for later; on the measured
    # profile that spills solar surplus, so self_consumption is the default.
    sub_strategy: {low: self_consumption, neutral: self_consumption, high: self_consumption}
    # Reserve stored energy for the day's priciest load (persistence load
    # forecast): discharge only in the most expensive intervals covering
    # reserve_factor x battery energy. Skipped on days expecting at least
    # reserve_skip_solar_frac x capacity of solar surplus. Tuned on 2023-2025.
    reserve_factor: 1.5
    reserve_skip_solar_frac: 1.0
    reserve_min_spread: 0.01
    breakeven_scales: [0.5, 0.75, 1.0, 1.25, 1.5]
  timed:
    window_hours: 3
    charge_starts: [1, 3, 12, 13]
    discharge_starts: [7, 17, 18, 19]
  # Forecast optimiser (model-predictive control, like EMHASS in Home
  # Assistant): every day at replan_hour, plan with the day-ahead prices known
  # then (until tomorrow night) and a usage/solar forecast = mean of the last
  # forecast_days days. wear_scale x wear per kWh is charged in the plan
  # (0.5 tuned on 2023-2025: lower cycles a lot more for ~EUR 1/yr, 0.75+
  # earns less). Planned on hourly steps (plan_minutes; 15 is 2x slower and
  # no better). LP-based like perfect_foresight, so headline years only.
  forecast:
    replan_hour: 13
    plan_minutes: 60
    forecast_days: 3
    wear_scale: 0.5
    tolerance_kwh: 0.02
  # Zero-export curtailment (dynamic contracts): after the battery has taken what
  # it can, remaining solar export is switched off in quarter-hours where export
  # is worth less than below_eur_kwh (0 = only negative-value export; a large
  # value = always zero export, which also gives up positive feed-in income).
  curtail:
    bases: [self_consumption, forecast]
    below_eur_kwh: 0.0
  perfect_foresight:
    soc_levels: 21

# Black Friday price variants (Specs.txt 11.5). Real deal prices go in
# batteries.csv (price_blackfriday_nl_incl_vat / price_blackfriday_de_excl_vat);
# until then a discount on the current price is used and labelled "(est.)".
# DE without a known German price: NL price without VAT, minus the discount.
blackfriday:
  enabled: true
  date: '2026-11-27'
  window: ['11-20', '12-01']   # MM-DD; the scraper records real deal prices in this window
  discount_nl: 0.15
  discount_de: 0.15
  estimates: true              # false = only real deals, no "(est.)" rows
  vat: 0.21

# Battery choice for Objective 4 and the earnings split (Specs.txt 11.4, 11.6).
# null = the battery with the fastest headline payback.
chosen_battery: null
# Batteries simulated in a run: all, shortlist, or a list of ids.
battery_set: all
battery_shortlist: [marstek_v3_5, marstek_v3_5_plug, marstek_v3_10, marstek_v3_15, marstek_venus_a_4, marstek_venus_a_6, anker_max_7,
                    anker_max_14, ecoflow_stream_5, ecoflow_stream_10, indevolt_sf3000_5, hoymiles_4020,
                    homewizard_2_7, zendure_2400acplus_5]

# Section 11: what the solar panels earn, year by year, with the actual
# contracts: the fixed contract (vast.txt, saldering) until fixed_contract_until,
# then the cheapest dynamic contract (2027-2029 rules, then 2030+ rules).
# Without PV data, production is modelled from kwp (clear-sky shape per 15 min,
# scaled per day to cover the measured export, yearly total = kwp x yield).
solar:
  install_date: '2024-07-01'
  price_eur: null                # total paid (panels, inverter, installation, after VAT refund)
  kwp: null                      # system size; null = estimate from export (self_share_if_unknown)
  yield_kwh_per_kwp: 900         # typical Dutch yearly yield
  self_share_if_unknown: 0.30    # share of production used in the house, only when kwp is unknown
  degradation_pct_per_year: 0.5
  lifetime_years: 25
  fixed_contract_until: '2027-01-01'
  latitude: 52.1
  longitude: 5.1

# Objective 4: pottery kiln on free power (Specs.txt 11.6). Assumptions, edit
# to the kiln's data sheet: a firing to maximum temperature (~1250-1300 C)
# takes firing_hours, and the kiln draws avg_duty x rated power on average.
kiln:
  powers_kw: [1.5, 2.0, 2.5, 3.0, 3.6, 4.5, 5.5, 7.5, 9.0, 11.0]
  firing_hours: 8
  avg_duty: 0.7
  start_hours: [6, 7, 8, 9, 10, 11]
  free_tolerance: 0.05       # a firing counts as free if <= 5% of its energy comes from the grid
  single_phase_max_kw: 3.68  # above this a kiln needs a three-phase connection
