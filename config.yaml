# battery_calc configuration. Every path, column name and tariff lives here.
# Values marked "verify: true" were entered by hand and should be checked
# against the source URL before relying on the results.

paths:
  data_dir: data
  p1_file: data/Energy_house.csv
  pv_file: data/pv_production.csv            # optional
  fixed_contract_file: data/vast.txt
  price_glob: data/jeroen_punt_nl_dynamische_stroomprijzen_jaar_*.csv
  # Scraped day-ahead prices (EnergyZero) fill recent months; jeroen.nl wins on overlap.
  extra_price_globs: [data/online/dayahead_energyzero_*.csv]
  taxes_file: data/online/taxes.csv        # scraped; overrides taxes.years when present
  energieknl_file: data/dynamic_prices_energieknl.csv   # optional cross-check
  online_dir: data/online
  contracts_file: data/online/contracts.csv
  batteries_file: data/online/batteries.csv
  results_dir: results

p1:
  time_column: time
  timezone: Europe/Amsterdam
  # The HomeWizard timestamp is the moment the counters were read, so the
  # delta at row t covers the 15 minutes *before* t.
  timestamp_marks: interval_end
  import_t1: Import T1 kWh       # T1 = dal / low tariff (NL convention)
  import_t2: Import T2 kWh       # T2 = normaal / normal tariff
  export_t1: Export T1 kWh
  export_t2: Export T2 kWh
  max_interpolate_gap_minutes: 60

pv:
  time_column: time
  energy_column: kWh             # per-interval kWh; or set power_column (W)
  power_column: null

prices:
  timezone: Europe/Amsterdam
  # Column-name hints for the jeroen.nl files. The loader picks the first
  # column whose lower-case name contains one of these.
  kale_hints: [excl, kaal, kale, epex, spot, day-ahead, dayahead]
  incl_hints: [incl]
  mwh_threshold: 5.0             # median |price| above this => €/MWh
  crosscheck_threshold_eur_kwh: 0.001

connection:
  default: 3x25
  margin: 0.20                   # --connection-margin
  volts: 230
  options: [1x25, 1x35, 1x40, 3x25, 3x35, 3x40, 3x50, 3x63]

tariff_hours:                    # used for synthetic intervals (T1/T2 rule)
  normal_start_hour: 7
  normal_end_hour: 21
  weekend_is_low: true

# Taxes per calendar year, excl. VAT. Years after the latest one are held
# flat and grown with escalation_pct.
taxes:
  vat: 0.21
  escalation_pct: 0.0
  years:
    2025:
      energy_tax_eur_kwh: 0.10154
      tax_reduction_eur_year: 524.95
      source_url: https://www.belastingdienst.nl/wps/wcm/connect/bldcontentnl/belastingdienst/zakelijk/overige_belastingen/belastingen_op_milieugrondslag/tarieven_milieubelastingen/tabellen_tarieven_milieubelastingen
      retrieved_at: '2026-10-02'
      verify: true
    2026:
      # Derived from vast.txt: (0.27125 - 0.16040) / 1.21
      energy_tax_eur_kwh: 0.09161
      tax_reduction_eur_year: 519.80
      source_url: https://www.belastingdienst.nl/wps/wcm/connect/bldcontentnl/belastingdienst/zakelijk/overige_belastingen/belastingen_op_milieugrondslag/tarieven_milieubelastingen/tabellen_tarieven_milieubelastingen
      retrieved_at: '2026-10-02'
      verify: true

# Grid operator charges, €/year excl. VAT, per connection size. Same for all
# suppliers, so they never change a ranking or a battery saving.
grid:
  operator: Enexis
  source: data/vast.txt (Netbeheerkosten Enexis Brabant)
  retrieved_at: '2026-10-02'
  eur_year_excl_vat:
    1x25: 393.25
    1x35: 393.25
    3x25: 393.25
    1x40: null                   # unknown: falls back to 3x25 with a warning
    3x35: null
    3x40: null
    3x50: null
    3x63: null

# Regimes (section 4). Each scenario names the rules applied to a year.
regimes:
  saldering:
    label: 2026 rules (saldering)
    saldering: true
    feed_in_min_frac: 0.0
    feed_in_incl_vat: true
  nosal_min50:
    label: 2027-2029 rules (no saldering, 50% minimum)
    saldering: false
    feed_in_min_frac: 0.5
    feed_in_incl_vat: false
  nosal_2030:
    label: 2030+ rules (no minimum)
    saldering: false
    feed_in_min_frac: 0.0        # sensitivity: 0.3
    feed_in_incl_vat: false
regime_by_year:                  # first year each regime applies
  saldering: 0
  nosal_min50: 2027
  nosal_2030: 2030
feed_in_min_2030_sensitivity: 0.30

scenario_flags:                  # possible future changes, off by default
  capacity_tariff: false
  capacity_tariff_eur_kw_month: 0.0

analysis:
  full_history_years: [2013, 2026]
  headline_years: [2023, 2025]
  year_groups:
    Pre-crisis: [2013, 2020]
    Crisis: [2021, 2022]
    Recent: [2023, 2026]
  purchase_date: '2026-10-02'
  discount_rate: 0.03
  horizon_years: 20

battery_defaults:
  rte: 0.85
  standby_w: 10
  cycle_life: 6000
  eol_capacity: 0.70
  warranty_years: 10
  dod: 1.0
  min_soc_pct: 0.0
  residual_value: 0.0
  cycles_per_year: 250
  de_travel_cost_eur: 50.0

strategies:
  enabled: [self_consumption, timed, dynamic, dynamic_sell, perfect_foresight]
  dynamic:
    low_quantile: 0.25
    high_quantile: 0.75
    # charge_pv in Low periods holds stored energy for later; on the measured
    # profile that spills solar surplus, so self_consumption is the default.
    sub_strategy: {low: self_consumption, neutral: self_consumption, high: self_consumption}
    breakeven_scales: [0.5, 0.75, 1.0, 1.25, 1.5]
  timed:
    window_hours: 3
    charge_starts: [1, 3, 12, 13]
    discharge_starts: [7, 17, 18, 19]
  perfect_foresight:
    soc_levels: 21
